<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#a9daf5" />
    <meta name="description" content="Hatch and raise a tiny creature on a floating island." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Pet Hatch" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./app-icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./app-icons/apple-touch-icon.png" />
    <title>Pet Hatch</title>
  </head>
  <body>
    <div id="app">
      <canvas id="scene"></canvas>

      <section id="status" class="card">
        <div class="status-head">
          <div class="status-text">
            <div class="title-row">
              <h1 id="title"></h1>
              <span id="chips" class="chips"></span>
            </div>
            <p id="subtitle" class="muted"></p>
          </div>
          <div class="status-buttons">
            <button id="btn-lights" class="round violet-btn" type="button" hidden></button>
            <button id="btn-more" class="round" type="button"></button>
          </div>
        </div>
        <div id="stages" class="stages"></div>
        <div id="needs" class="needs"></div>
        <div id="leaning" class="leaning">
          <span id="lean-title" class="muted"></span>
          <div class="lean-bar">
            <div id="lean-ember" class="lean-ember"></div>
            <div id="lean-tide" class="lean-tide"></div>
            <div id="lean-bloom" class="lean-bloom"></div>
          </div>
          <span id="lean-label"></span>
        </div>
        <div id="vitals" class="vitals" hidden>
          <span id="health" class="health"></span>
          <div class="discipline">
            <span id="discipline-label"></span>
            <div class="track"><div id="discipline-fill" class="fill"></div></div>
          </div>
        </div>
      </section>

      <p id="hint" class="hint"></p>
      <div id="update" class="update card" role="status" hidden>
        <span id="update-text"></span>
        <button id="update-reload" class="primary" type="button"></button>
        <button id="update-later" class="round" type="button"></button>
      </div>
      <div id="toast" class="toast" role="status" aria-live="polite"></div>
      <nav id="dock" class="dock card"></nav>

      <div id="overlay" class="overlay" hidden>
        <div class="sheet card" role="dialog" aria-modal="true" aria-labelledby="overlay-title">
          <h2 id="overlay-title"></h2>
          <p id="overlay-body"></p>
          <label id="overlay-field" class="overlay-field" hidden>
            <span id="overlay-label"></span>
            <input id="overlay-input" type="text" maxlength="14" autocomplete="off" enterkeyhint="done" />
          </label>
          <fieldset id="overlay-choices" class="overlay-choices" hidden></fieldset>
          <button id="overlay-button" class="primary" type="button"></button>
        </div>
      </div>

      <div id="activity" class="overlay" hidden>
        <div class="sheet card train-sheet" role="dialog" aria-modal="true"></div>
      </div>

      <dialog id="settings" class="card" aria-labelledby="settings-title"></dialog>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
